<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>semanticIQ • Access Denied</title>
  <link rel="stylesheet" href="/static/core/studio.css" />

  <style>
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid #ddd;
    }

    .left-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .left-header p {
      margin: 0;
      color: #666;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60vh;
    }

    .card {
      width: 360px;
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      text-align: center;
    }

    .danger {
      color: #d9534f;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .btn {
      display: block;
      padding: 10px;
      margin-top: 12px;
      border-radius: 6px;
      text-decoration: none;
      color: white;
    }

    .btn-primary {
      background: #444;
    }

    .btn-primary:hover {
      background: #333;
    }

    .btn-secondary {
      background: #d9534f;
    }

    .btn-secondary:hover {
      background: #c9302c;
    }
  </style>
</head>

<body>

  <header>
    <div class="left-header">
      <h1>semanticIQ • Access Denied</h1>
      <p>You do not have permission for this tenant.</p>
    </div>
  </header>

  <main>
    <div class="card">
      <h2 class="danger">Access Denied</h2>
      <p>You are not a member of this tenant or your access has been removed.</p>

      <a href="/switch_tenant" class="btn btn-primary">Choose Another Tenant</a>
      <a href="/logout" class="btn btn-secondary">Log Out</a>
    </div>
  </main>

  <footer>
    <div id="status">Welcome to semanticIQ</div>
  </footer>

</body>
</html>
