<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>semanticIQ • Login</title>
  <link rel="stylesheet" href="/static/core/studio.css" />

  <style>
    body {
    margin: 0;
    font-family: Inter, sans-serif;
    background: #f4f6f8;
    color: #333;
    }

    header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 32px;
    background: #000000;
    border-bottom: 1px solid #ddd;
    }

    .left-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .left-header p {
      margin: 0;
      color: #666;
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60vh;
    }

    .login-card {
      width: 360px;
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      text-align: left;
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 12px;
      text-align: center;
      font-size: 22px;
    }

    .login-card p.subtitle {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }    

    .error-message {
      margin-bottom: 12px;
      padding: 8px 10px;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      font-size: 13px;
    }

    .helper-links {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
    }

    .helper-links a {
      color: #444;
      text-decoration: none;
    }

    .helper-links a:hover {
      text-decoration: underline;
    }

   footer { position: fixed; 
    bottom: 0; 
    left: 0; 
    width: 100%; 
    padding: 20px 0; 
    background: #000; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    border-top: 1px solid #222; }

  #status {
    font-family: Inter, sans-serif;   /* Clean sans-serif font */
    font-size: 14px;
    color: #bbb;                      /* Soft grey for a refined look */
    letter-spacing: 0.3px;
  }

  .button {
    width: 100%;
    padding: 12px 20px;
    background: #0078ff;      /* Same as #chat-send */
    color: white;
    border: none;
    border-radius: 10px;      /* Same rounded look */
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    font-family: Inter, sans-serif;
    transition: background 0.2s ease, transform 0.15s ease;
}

.button:hover {
    background: #005fcc;      /* Same hover color */
}

.button:active {
    transform: scale(0.97);
}

  </style>
</head>

<body>

  <header>
    <div class="left-header">
      <h1>semanticiq • Sign in</h1>
      <p>Access your models and runtime environment.</p>
    </div>
  </header>

  <main>
    <div class="login-card">
      <h2>Welcome</h2>
      <p class="subtitle">Sign in to continue to semanticIQ.</p>

      {% if form.errors or form.non_field_errors %}
        <div class="error-message">
          Invalid username or password. Please try again.
        </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_username">Username</label>
          <input
            type="text"
            name="username"
            id="id_username"
            required
            autofocus
            value="{{ form.username.value|default_if_none:'' }}"
          />
        </div>

        <div class="form-group">
          <label for="id_password">Password</label>
          <input
            type="password"
            name="password"
            id="id_password"
            required
          />
        </div>

        <button type="submit" class="button">Sign in</button>
      </form>

      <div class="helper-links">        
        <a href="{% url 'password_reset' %}">Forgot your password?</a>
      </div>
    </div>
  </main>

  <footer>
    <div id="status">© semanticIQ <script>document.write(/\d{4}/.exec(Date())[0])</script>. All Rights Reserved.</div>
  </footer>

</body>
</html>
